document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

id-template-columns:1fr 1fr;gap:14px\">\n      <div style=\"background:#FDFFFE;border:1px solid #E5EEEA;border-radius:16px;padding:22px\">\n        <div style=\"font-size:19px;font-weight:600;letter-spacing:-0.02em;line-height:1.25\">Agents deadlock on prompts. So we never prompt.<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:rgba(13,13,13,0.55);margin-top:10px\">No interactive questions, ever. Zero args prints usage, not an error. Ten thousand runs, identical behavior.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FDFFFE;border:1px solid #E5EEEA;border-radius:16px;padding:22px\">\n        <div style=\"font-size:19px;font-weight:600;letter-spacing:-0.02em;line-height:1.25\">Errors you can branch on.<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:rgba(13,13,13,0.75);margin-top:10px;line-height:1.9\">0 ok · 2 input.invalid · 4 auth.no_token · 5 token_expired · 6 permission_denied · 8 rate_limited / idempotency hit · 12 claim.not_claimable<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FDFFFE;border:1px solid #E5EEEA;border-radius:16px;padding:22px;display:flex;gap:18px;align-items:center\">\n        <div style=\"flex:1\">\n          <div style=\"font-size:19px;font-weight:600;letter-spacing:-0.02em;line-height:1.25\">Effective permission = account ∩ key scopes ∩ endpoint allowlist.<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:rgba(13,13,13,0.55);margin-top:10px\">Server-enforced. Keys are scoped, expiring (1h / 1d / 30d / 90d), and irreversibly revocable from the dashboard.<\u002Fdiv>\n        <\u002Fdiv>\n        <svg width=\"110\" height=\"96\" sc-camel-view-box=\"0 0 110 96\" aria-hidden=\"true\" style=\"flex:none\">\n          <circle cx=\"42\" cy=\"36\" r=\"28\" fill=\"rgba(18,209,107,0.10)\" stroke=\"#087E4C\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"68\" cy=\"36\" r=\"28\" fill=\"rgba(18,209,107,0.10)\" stroke=\"#087E4C\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"55\" cy=\"58\" r=\"28\" fill=\"rgba(18,209,107,0.10)\" stroke=\"#087E4C\" stroke-width=\"1.5\"><\u002Fcircle>\n          <circle cx=\"55\" cy=\"43\" r=\"6\" fill=\"#12D16B\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"background:#FDFFFE;border:1px solid #E5EEEA;border-radius:16px;padding:22px\">\n        <div style=\"font-size:19px;font-weight:600;letter-spacing:-0.02em;line-height:1.25\">Private keys never enter the CLI.<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:rgba(13,13,13,0.55);margin-top:10px\">Signing happens in the browser (passkey) or a server-side restricted session. The CLI only ever sees the resulting tx hash.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-fx=\"1\" style=\"margin-top:48px;max-width:860px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px\">\n        <div style=\"font-weight:600;font-size:15px\">Installed by agents, for agents.<\u002Fdiv>\n        <button id=\"installReplay\" style=\"display:inline-flex;align-items:center;gap:6px;background:#0D0D0D;color:#FDFFFE;border:none;border-radius:30px;height:34px;padding:0 16px;font-family:Archivo,sans-serif;font-weight:600;font-size:12.5px;cursor:pointer\" style-hover=\"background:#000000\">▶ Replay<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"background:#0D0D0D;border-radius:16px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.08)\">\n          <span style=\"width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.18)\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.18)\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.18)\"><\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,0.55);margin-left:6px\">claude code — terminal<\u002Fspan>\n        <\u002Fdiv>\n        <pre id=\"installPre\" style=\"margin:0;padding:16px;font-family:'DM Mono',monospace;font-size:12.5px;line-height:1.8;color:#E7F5EE;min-height:150px;overflow-x:auto\"><span style=\"color:#E7F5EE\">▸ add billing to ./packages/example-server, one cent per call<\u002Fspan>\n\n<span style=\"color:#12D16B\">  ✓ wrote tab.config.json<\u002Fspan>\n<span style=\"color:rgba(231,245,238,0.55)\">    { \"pricing\": { \"default\": \"0.01\" }, \"settleThreshold\": \"0.50\" }<\u002Fspan>\n<span style=\"color:#12D16B\">  ✓ every tool on this server is now billed<\u002Fspan>\n<span style=\"color:#F2B94F\">  → over the limit answers 402 PAYMENT_REQUIRED<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:rgba(13,13,13,0.55);margin-top:10px;max-width:720px\">Tab ships as an MCP server — tell Claude Code what you want and the agent completes the integration.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-fx=\"1\" style=\"margin-top:48px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch\">\n      <div style=\"border-top:2px solid #087E4C;padding:14px 16px 0 0\"><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#087E4C\">1<\u002Fdiv><div style=\"font-size:13.5px;font-weight:500;margin-top:4px\">discovers the API<\u002Fdiv><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:rgba(13,13,13,0.55);margin-top:3px\">operations / describe<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:2px solid #087E4C;padding:14px 16px 0 0\"><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#087E4C\">2<\u002Fdiv><div style=\"font-size:13.5px;font-weight:500;margin-top:4px\">spends on credit<\u002Fdiv><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:rgba(13,13,13,0.55);margin-top:3px\">metered, zero-latency<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:2px solid #087E4C;padding:14px 16px 0 0\"><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#087E4C\">3<\u002Fdiv><div style=\"font-size:13.5px;font-weight:500;margin-top:4px\">hits the limit<\u002Fdiv><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:rgba(13,13,13,0.55);margin-top:3px\">a 402 it can parse<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:2px solid #087E4C;padding:14px 0 0 0\"><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#087E4C\">4<\u002Fdiv><div style=\"font-size:13.5px;font-weight:500;margin-top:4px\">settles the cycle<\u002Fdiv><div style=\"font-family:'DM Mono',monospace;font-size:11px;color:rgba(13,13,13,0.55);margin-top:3px\">payout send, idempotent<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p id=\"visionP\" data-fx=\"1\" style=\"margin:72px 0 0;font-size:clamp(26px,2.8vw,38px);font-weight:600;letter-spacing:-0.02em;line-height:1.25;max-width:900px;text-wrap:pretty\">MCP made every tool <em style=\"font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:#087E4C\">readable<\u002Fem> by agents. Tab makes every tool <em id=\"payableEm\" style=\"display:inline-block;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:#009859\">payable<\u002Fem>.<\u002Fp>\n    <div data-fx=\"1\" style=\"margin-top:56px\">\n      <div id=\"rmTrack\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px\">\n        <div style=\"position:relative;height:9px\">\n          <div id=\"rmNow\" style=\"position:absolute;left:0;top:3px;height:3px;width:100%;background:#009859;border-radius:999px\">\n            <div style=\"position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:#12D16B;box-shadow:0 0 10px rgba(18,209,107,0.8)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:9px;display:flex;align-items:center\"><div style=\"width:100%;border-top:3px dashed #E5EEEA\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n        <div style=\"background:#FDFFFE;border:1px solid #E5EEEA;border-left:3px solid #009859;border-radius:16px;padding:18px;transition:transform 0.15s ease,box-shadow 0.15s ease\" style-hover=\"transform:translateY(-2px);box-shadow:0 4px 24px rgba(0,0,0,0.08)\">\n          <div style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#087E4C\">NOW<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:2;margin-top:8px\">billing middleware<br>x402-compatible handshake<br>agent-driven onboarding<br>real on-chain settlement<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FDFFFE;border:1px solid #E5EEEA;border-radius:16px;padding:18px;transition:transform 0.15s ease,box-shadow 0.15s ease\" style-hover=\"transform:translateY(-2px);box-shadow:0 4px 24px rgba(0,0,0,0.08)\">\n          <div style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.12em;color:rgba(13,13,13,0.55)\">LATER<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:2;margin-top:8px\">design partners<br>agent credit scores<br>dynamic limits<br>batch settlement<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-fx=\"1\" style=\"margin-top:56px;max-width:860px\">\n      <details style=\"background:#F2F8F5;border:1px solid #E5EEEA;border-radius:16px 16px 0 0;padding:0 20px\">\n        <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-weight:600;font-size:15px\">How is this different from x402?<span class=\"faq-ind\" style=\"font-family:'DM Mono',monospace;font-size:16px;color:#087E4C\"><\u002Fspan><\u002Fsummary>\n        <div style=\"padding:0 0 18px;font-size:14px;color:rgba(13,13,13,0.75);max-width:700px;text-wrap:pretty\">x402 charges per call: the agent pays, on-chain, before the tool responds. Tab meters locally and settles at term, so calls carry no payment round-trip and the agent never needs to hold funds mid-task. The 402 envelope is the same shape, so migrating is a middleware swap, not a protocol change.<\u002Fdiv>\n      <\u002Fdetails>\n      <details style=\"background:#F2F8F5;border:1px solid #E5EEEA;border-top:none;padding:0 20px\">\n        <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-weight:600;font-size:15px\">Can an agent drain my wallet?<span class=\"faq-ind\" style=\"font-family:'DM Mono',monospace;font-size:16px;color:#087E4C\"><\u002Fspan><\u002Fsummary>\n        <div style=\"padding:0 0 18px;font-size:14px;color:rgba(13,13,13,0.75);max-width:700px;text-wrap:pretty\">No. Spending is capped by a fence granted in the dashboard with a passkey — per transaction, in total, and with an expiry — enforced server-side and scoped to a single chain × token pair. Undelegated pairs are refused outright. The fence is revocable at any time, irreversibly.<\u002Fdiv>\n      <\u002Fdetails>\n      <details style=\"background:#F2F8F5;border:1px solid #E5EEEA;border-top:none;border-radius:0 0 16px 16px;padding:0 20px\">\n        <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-weight:600;font-size:15px\">What happens to money nobody claims?<span class=\"faq-ind\" style=\"font-family:'DM Mono',monospace;font-size:16px;color:#087E4C\"><\u002Fspan><\u002Fsummary>\n        <div style=\"padding:0 0 18px;font-size:14px;color:rgba(13,13,13,0.75);max-width:700px;text-wrap:pretty\">A payout funds a claim link. If it goes unclaimed, the funds are returned to the buyer automatically and the bill simply stays unpaid — see the refund transaction above. A bill is only marked paid once the claim is proven on-chain.<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <footer style=\"max-width:1060px;margin:80px auto 0;padding:28px 0 24px;border-top:1px solid #E5EEEA;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center\">\n    <div>\n      <div style=\"font-size:13.5px;font-weight:500\">AllScale Tab · a BUIDL_QUESTS 2026 hackathon project<\u002Fdiv>\n      <div style=\"font-size:12px;color:rgba(13,13,13,0.55);margin-top:4px\">Built on AllScale payment infrastructure · gamma environment, Sepolia testnet<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px\">\n      <a href=\"#\" style=\"font-size:13px;font-weight:500\">GitHub<\u002Fa>\n      <a href=\"#\" style=\"font-size:13px;font-weight:500\">AllScale<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;githubUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot;}, &quot;motion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    if (this.props.motion === false) return;\n    this._timers = [];\n    const later = (fn, ms) => { const t = setTimeout(fn, ms); this._timers.push(t); return t; };\n    const every = (fn, ms) => { const t = setInterval(fn, ms); this._timers.push(t); return t; };\n\n    // fadeUp on scroll\n    const fx = document.querySelectorAll('[data-fx]');\n    let ioFired = false;\n    const io = new IntersectionObserver(entries => {\n      ioFired = true;\n      entries.forEach(e => {\n        if (e.isIntersecting) { e.target.style.opacity = ''; e.target.style.animation = 'fadeUp 0.7s ease both'; io.unobserve(e.target); }\n      });\n    }, { threshold: 0.15 });\n    fx.forEach(el => io.observe(el));\n    this._io = io;\n    // hide below-fold elements only once IO proves it's delivering entries;\n    // safety net restores everything if reveals ever stall\n    later(() => {\n      if (!ioFired) return;\n      fx.forEach(el => {\n        if (el.style.animation === '' && el.getBoundingClientRect().top > window.innerHeight) el.style.opacity = '0';\n      });\n      every(() => { fx.forEach(el => {\n        if (el.style.opacity === '0' && el.style.animation !== '') el.style.opacity = '';\n      }); }, 1000);\n    }, 150);\n\n    // Act 1 baseline square: track the subhead's vertical midpoint\n    const baseSq = document.getElementById('baseSquare'), heroSub = document.getElementById('heroSub'), act1El = document.getElementById('act1');\n    if (baseSq && heroSub && act1El) {\n      const placeSq = () => {\n        const s = act1El.getBoundingClientRect(), p = heroSub.getBoundingClientRect();\n        baseSq.style.top = (p.top - s.top + p.height / 2 - 2.5) + 'px';\n      };\n      placeSq();\n      later(placeSq, 400);\n      window.addEventListener('resize', placeSq);\n      this._placeSq = placeSq;\n    }\n\n    // Act 1 counter + bar\n    const count = document.getElementById('mcpCount'), bar = document.getElementById('mcpBar');\n    if (count && bar) {\n      const act1 = document.getElementById('act1');\n      const io1 = new IntersectionObserver(es => {\n        if (!es[0].isIntersecting) return;\n        io1.disconnect();\n        bar.style.width = '0%';\n        const t0 = performance.now(), dur = 2000;\n        const step = now => {\n          const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);\n          bar.style.width = (e * 100) + '%';\n          count.textContent = p < 1 ? Math.floor(e * 20000).toLocaleString('en-US') : '20,000+';\n          if (p < 1) requestAnimationFrame(step);\n        };\n        requestAnimationFrame(step);\n      }, { threshold: 0.4 });\n      io1.observe(act1);\n    }\n\n    // Act 1 live call feed\n    const feed = document.getElementById('callFeed');\n    if (feed) {\n      const tools = ['fx_rate', 'fx_convert', 'search_docs', 'get_quote', 'list_symbols'];\n      every(() => {\n        const t = tools[Math.floor(Math.random() * tools.length)];\n        const ms = 14 + Math.floor(Math.random() * 23);\n        const row = document.createElement('div');\n        row.style.cssText = \"display:flex;justify-content:space-between;align-items:center;font-family:'DM Mono',monospace;font-size:13.5px;animation:fadeUp 0.35s ease both\";\n        row.innerHTML = '<span>' + t + '<\u002Fspan><span style=\"font-size:11px;background:#F2F8F5;border:1px solid #E5EEEA;border-radius:999px;padding:2px 9px\">' + ms + 'ms<\u002Fspan>';\n        feed.insertBefore(row, feed.firstChild);\n        while (feed.children.length > 3) feed.removeChild(feed.lastChild);\n      }, 1600);\n    }\n\n    // Act 2 split-screen loop\n    const lRows = document.getElementById('leftRows'), rRows = document.getElementById('rightRows'),\n          popup = document.getElementById('leftPopup'), lT = document.getElementById('leftTimer'),\n          rT = document.getElementById('rightTab');\n    if (lRows && rRows) {\n      const mkBar = w => { const d = document.createElement('div'); d.style.cssText = 'height:8px;flex:none;width:' + w + '%;background:#E5EEEA;border-radius:4px'; return d; };\n      const mkBarG = w => { const d = mkBar(w); d.style.background = 'rgba(18,209,107,0.35)'; return d; };\n      const mkNote = () => { const d = document.createElement('div'); d.style.cssText = \"flex:none;font-family:'DM Mono',monospace;font-size:10.5px;color:rgba(13,13,13,0.55)\"; d.textContent = '⏸ confirm payment… signing… waiting for chain…'; return d; };\n      const widths = [62,55,68,48,60,52,66,45,58,70];\n      let running = false;\n      const runLoop = () => {\n        if (running) return; running = true;\n        let i = 0, lat = 0, tab = 0;\n        lRows.innerHTML = ''; rRows.innerHTML = '';\n        lT.textContent = '+0.0s'; rT.textContent = '+$0.00';\n        const right = every(() => {\n          if (rRows.children.length >= 30) return;\n          rRows.appendChild(mkBarG(widths[rRows.children.length % 10]));\n          tab += 0.01; rT.textContent = '+$' + tab.toFixed(2);\n          rRows.scrollTop = rRows.scrollHeight;\n        }, 160);\n        const left = every(() => {\n          i++;\n          if (i > 30) {\n            clearInterval(left); clearInterval(right);\n            later(runLoop2, 2600);\n            return;\n          }\n          popup.style.opacity = '1';\n          later(() => { popup.style.opacity = '0'; }, 260);\n          if (i % 2 === 1) lRows.appendChild(mkNote()); else lRows.appendChild(mkBar(widths[i % 10]));\n          lat += 1.4; lT.textContent = '+' + lat.toFixed(1) + 's';\n          lRows.scrollTop = lRows.scrollHeight;\n        }, 520);\n        const runLoop2 = () => { running = false; runLoop(); };\n      };\n      const io2 = new IntersectionObserver(es => { if (es[0].isIntersecting) { io2.disconnect(); runLoop(); } }, { threshold: 0.3 });\n      io2.observe(document.getElementById('act2'));\n    }\n\n    // Act 3 receipt loop\n    const lines = document.getElementById('receiptLines'), stamp = document.getElementById('paidStamp');\n    if (lines && stamp) {\n      const mkLine = () => {\n        const d = document.createElement('div');\n        d.style.cssText = 'display:flex;justify-content:space-between';\n        d.innerHTML = '<span>fx_rate<\u002Fspan><span style=\"color:rgba(13,13,13,0.35)\">·····<\u002Fspan><span>$0.01<\u002Fspan>';\n        return d;\n      };\n      const cycle = () => {\n        lines.innerHTML = ''; stamp.style.opacity = '0'; stamp.style.animation = 'none';\n        let n = 0;\n        const iv = every(() => {\n          n++;\n          if (n <= 9) { lines.appendChild(mkLine()); }\n          else {\n            clearInterval(iv);\n            stamp.style.animation = 'stampIn 0.35s cubic-bezier(.34,1.56,.64,1) both';\n            later(cycle, 3200);\n          }\n        }, 340);\n      };\n      const io3 = new IntersectionObserver(es => { if (es[0].isIntersecting) { io3.disconnect(); cycle(); } }, { threshold: 0.4 });\n      io3.observe(document.getElementById('act3'));\n    }\n\n    // Act 6 settlement replay (~12s, re-triggerable)\n    const balBig = document.getElementById('balBig'), setBar = document.getElementById('setBar'),\n          setPre = document.getElementById('setPre'), pillDot = document.getElementById('tabPillDot'),\n          pillTxt = document.getElementById('tabPillTxt'), settledNote = document.getElementById('settledNote'),\n          settleBtn = document.getElementById('settleReplay');\n    const typeLine = (pre, text, color, done) => {\n      const s = document.createElement('div');\n      s.style.color = color;\n      s.style.whiteSpace = 'pre';\n      s.textContent = '\\u00A0';\n      pre.appendChild(s);\n      let c = 0;\n      const iv = every(() => {\n        c++; s.textContent = text.slice(0, c);\n        if (c >= text.length) { clearInterval(iv); done && done(); }\n      }, 12);\n    };\n    if (balBig && setPre) {\n      this._cycles = 0;\n      let settleRunning = false;\n      const settleRun = () => {\n        if (settleRunning) return; settleRunning = true;\n        let bal = 0;\n        balBig.textContent = '$0.00'; balBig.style.color = '#0D0D0D';\n        setBar.style.width = '0%';\n        setPre.innerHTML = '';\n        pillTxt.textContent = 'open'; pillDot.style.background = '#12D16B';\n        settledNote.style.visibility = 'hidden';\n        let ticks = 0;\n        const tick = () => {\n          bal = Math.round((bal + 0.01) * 100) / 100; ticks++;\n          balBig.textContent = '$' + bal.toFixed(2);\n          balBig.style.color = '#12D16B';\n          later(() => { balBig.style.color = '#0D0D0D'; }, 90);\n          setBar.style.width = (bal / 0.5 * 100) + '%';\n          if (bal >= 0.5) {\n            pillTxt.textContent = 'settling'; pillDot.style.background = '#F2B94F';\n            later(() => {\n              typeLine(setPre, '$ allscale invoice send --line \"fx_rate|50|0.50\" --memo tab-claude-2026w33', '#F2B94F', () => {\n                later(() => {\n                  typeLine(setPre, '$ allscale payout send --amount 0.50 --chain sepolia --stable-coin USDT --reference-id tab-claude-2026w33', '#12D16B', () => {\n                    later(() => {\n                      typeLine(setPre, '$ allscale claim-link claim --claim-token *** --to-wallet', '#12D16B', () => {\n                        later(() => {\n                          balBig.textContent = '$0.00';\n                          setBar.style.width = '0%';\n                          this._cycles++;\n                          settledNote.textContent = 'Settled $0.50 · cycles ' + this._cycles;\n                          settledNote.style.visibility = 'visible';\n                          pillTxt.textContent = 'open'; pillDot.style.background = '#12D16B';\n                          settleRunning = false;\n                        }, 400);\n                      });\n                    }, 400);\n                  });\n                }, 400);\n              });\n            }, 300);\n          } else later(tick, ticks < 5 ? 120 : 40);\n        };\n        later(tick, 120);\n      };\n      settleBtn.addEventListener('click', settleRun);\n      const io6 = new IntersectionObserver(es => { if (es[0].isIntersecting) { io6.disconnect(); settleRun(); } }, { threshold: 0.35 });\n      io6.observe(document.getElementById('act6'));\n    }\n\n    // Act 8 install typewriter (once on view, re-triggerable)\n    const instPre = document.getElementById('installPre'), instBtn = document.getElementById('installReplay');\n    if (instPre) {\n      let instRunning = false;\n      const instRun = () => {\n        if (instRunning) return; instRunning = true;\n        instPre.innerHTML = '';\n        const seq = [\n          ['▸ add billing to ./packages/example-server, one cent per call', '#E7F5EE'],\n          ['', '#E7F5EE'],\n          ['  ✓ wrote tab.config.json', '#12D16B'],\n          ['    { \"pricing\": { \"default\": \"0.01\" }, \"settleThreshold\": \"0.50\" }', 'rgba(231,245,238,0.55)'],\n          ['  ✓ every tool on this server is now billed', '#12D16B'],\n          ['  → over the limit answers 402 PAYMENT_REQUIRED', '#F2B94F']\n        ];\n        let i = 0;\n        const next = () => {\n          if (i >= seq.length) { instRunning = false; return; }\n          const [txt, col] = seq[i]; i++;\n          if (txt === '') { const b = document.createElement('div'); b.textContent = '\\u00A0'; instPre.appendChild(b); later(next, 120); }\n          else typeLine(instPre, txt, col, () => later(next, i === 1 ? 600 : 180));\n        };\n        next();\n      };\n      instBtn.addEventListener('click', instRun);\n      const io8 = new IntersectionObserver(es => { if (es[0].isIntersecting) { io8.disconnect(); instRun(); } }, { threshold: 0.35 });\n      io8.observe(instPre);\n    }\n\n    // Act 8 roadmap track growth + vision word morph\n    const rmNow = document.getElementById('rmNow'), rmTrack = document.getElementById('rmTrack'),\n          payEm = document.getElementById('payableEm'), visionP = document.getElementById('visionP');\n    if (rmNow && visionP) {\n      const ioR = new IntersectionObserver(es => es.forEach(e => {\n        if (!e.isIntersecting) return;\n        ioR.unobserve(e.target);\n        if (e.target === visionP && payEm) payEm.style.animation = 'payableIn 0.7s ease 0.6s both';\n        if (e.target === rmTrack) rmNow.style.animation = 'trackGrow 0.9s ease-out both';\n      }), { threshold: 0.3 });\n      ioR.observe(visionP); ioR.observe(rmTrack);\n    }\n\n    // Hero question: delayed reveal of the key words\n    const qEm = document.getElementById('gettingPaidEm');\n    if (qEm) {\n      const ioQ = new IntersectionObserver(es => { if (es[0].isIntersecting) { ioQ.disconnect(); qEm.style.animation = 'payableIn 0.6s ease 0.4s both'; } }, { threshold: 0.4 });\n      ioQ.observe(qEm.parentElement);\n    }\n\n    // Act 5 kill switch tremble\n
