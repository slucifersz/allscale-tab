<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AllScale Tab — A line of credit for AI agents</title>
    <meta name="description" content="AllScale Tab — a line of credit for AI agents. Consume now, settle on terms." />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        --bg: #07090d;
        --text: #e6ebf2;
        --muted: #7c8798;
        --accent: #35d07f;
        --line: #1e2632;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(1100px 560px at 50% -12%, #101a24 0%, var(--bg) 58%);
        color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      main { max-width: 40rem; }
      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 3.75rem);
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      h1 .dot { color: var(--accent); }
      .tagline {
        margin: 18px 0 0;
        font-size: clamp(1.05rem, 3.2vw, 1.375rem);
        color: var(--text);
      }
      .status {
        margin: 28px 0 0;
        font-family: var(--mono);
        font-size: 0.8125rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }
      .status .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(53, 208, 127, 0.55);
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(53, 208, 127, 0.55); }
        70% { box-shadow: 0 0 0 11px rgba(53, 208, 127, 0); }
        100% { box-shadow: 0 0 0 0 rgba(53, 208, 127, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .status .pulse { animation: none; }
      }
      .repo {
        margin: 36px 0 0;
        padding-top: 26px;
        border-top: 1px solid var(--line);
      }
      .repo a {
        font-family: var(--mono);
        font-size: 0.9375rem;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 0.18s ease, border-color 0.18s ease;
      }
      .repo a:hover,
      .repo a:focus-visible {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .repo svg {
        width: 15px;
        height: 15px;
        vertical-align: -2px;
        margin-right: 7px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AllScale Tab<span class="dot">.</span></h1>
      <p class="tagline">A line of credit for AI agents.</p>
      <p class="status"><span class="pulse" aria-hidden="true"></span>Full showcase deploying shortly</p>
      <p class="repo">
        <a href="https://github.com/slucifersz/allscale-tab">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>github.com/slucifersz/allscale-tab</a>
      </p>
    </main>
  </body>
</html>
